<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Pets OS</title>
<link rel="stylesheet" href="css/pets.css">
<link rel="stylesheet" href="css/stepos.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pets OS">
</head>
<body>
<div id="phone">
  <div id="wall"></div>

  <div id="home" class="layer">
    <div id="pages"></div>
    <div id="dots"></div>
    <div id="dock"></div>
  </div>

  <div id="apps" class="layer"></div>
  <div id="recents" class="layer hidden"></div>

  <div id="lock" class="layer gone">
    <div class="date"></div>
    <div class="clock"></div>
    <div class="notes"></div>
    <div class="quick">
      <button data-q="torch" aria-label="Torch"></button>
      <button data-q="camera" aria-label="Camera"></button>
    </div>
    <div class="hint"><span>Swipe up to open</span><div class="bar"></div></div>
  </div>
  <div id="pin" class="layer hidden">
    <div class="who"><div class="logo"></div><span>Enter passcode</span></div>
    <div class="dots"></div>
    <div class="msg"></div>
    <div class="keys"></div>
  </div>

  <div id="cc" class="sheet"><div class="inner"></div></div>
  <div id="nc" class="sheet"><div class="inner"></div></div>
  <div id="rest" class="sheet"><div class="inner"></div></div>

  <div id="status">
    <div class="l"><div class="logo"></div><span class="time"></span></div>
    <div class="r"><span class="net"></span><span class="batt"><span class="pct"></span><span class="cell"><i></i></span></span></div>
  </div>

  <div id="toast"></div>
  <div id="setup" class="layer hidden"></div>
  <div id="boot"><div class="logo"></div></div>
</div>
<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<script src="js/apps.js"></script>
<script src="js/store.js"></script>
<script src="js/stephone.js"></script>
<script src="js/icons-hd.js"></script>
<script src="js/settings.js"></script>
<script src="js/nav.js"></script>
<script src="js/features.js"></script>
<script src="js/features2.js"></script>
<script src="js/phone.js"></script>
<script src="js/updates.js"></script>
<script src="js/suite-apps.js"></script>
<script src="js/suite-upgrades.js"></script>
<script src="js/suite.js"></script>
<script src="js/suite-test.js"></script>
<script src="js/selftest.js"></script>
<script>PetsOS.start();</script>
</body>
</html>
