<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sonix</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.mzstatic.com; media-src 'self' blob: https://archive.org https://*.archive.org https://*.itunes.apple.com https://*.apple.com; connect-src 'self' https://itunes.apple.com; script-src 'self'; worker-src 'self' blob:">
<link rel="stylesheet" href="style.css">
<script src="../shim.js" data-app="sonix"></script>
</head>
<body>
<div id="app">
  <nav id="sidebar" aria-label="Sections">
    <div class="side-section">Sonix</div>
    <button class="side-item" data-act="nav" data-id="home"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z" fill="currentColor"/></svg><span>Home</span></button>
    <button class="side-item" data-act="nav" data-id="search"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="m15.5 15.5 5.5 5.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg><span>Search</span></button>
    <button class="side-item" data-act="nav" data-id="library"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2.5" fill="currentColor"/><rect x="5" y="5.5" width="14" height="2" rx="1" fill="currentColor"/><rect x="7" y="2.5" width="10" height="2" rx="1" fill="currentColor"/></svg><span>Library</span></button>
    <div class="side-section">Create</div>
    <button class="side-item" data-act="nav" data-id="studio"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h1M7 8v8M11 4v16M15 7v10M19 10v4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg><span>Studio</span></button>
    <button class="side-item" data-act="nav" data-id="collaborations"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.6" fill="currentColor"/><path d="M2 20c0-4 3.2-6.5 7-6.5s7 2.5 7 6.5z" fill="currentColor"/><circle cx="17" cy="8.5" r="2.8" fill="currentColor"/><path d="M17 13c3 0 5 2 5 5.5h-4.5c0-2.2-.8-4-2.3-5.3.6-.1 1.2-.2 1.8-.2z" fill="currentColor"/></svg><span>Collaborations</span></button>
    <span class="grow"></span>
    <button class="side-settings" data-act="settings"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm9 4.8v-2.6l-2.3-.5a7 7 0 0 0-.7-1.6l1.3-2-1.9-1.9-2 1.3a7 7 0 0 0-1.6-.7L13.3 3h-2.6l-.5 2.3a7 7 0 0 0-1.6.7l-2-1.3-1.9 1.9 1.3 2a7 7 0 0 0-.7 1.6L3 10.7v2.6l2.3.5c.2.6.4 1.1.7 1.6l-1.3 2 1.9 1.9 2-1.3c.5.3 1 .5 1.6.7l.5 2.3h2.6l.5-2.3c.6-.2 1.1-.4 1.6-.7l2 1.3 1.9-1.9-1.3-2c.3-.5.5-1 .7-1.6z"/></svg><span>Settings</span></button>
  </nav>
  <main id="detail-wrap">
    <div id="toolbar"><button id="back" class="icon-btn" data-act="back" aria-label="Back" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span id="nav-title"></span></div>
    <div id="detail"><div id="detail-inner"></div></div>
  </main>
  <footer id="mini" hidden></footer>
</div>

<div id="now-playing" class="sheet-backdrop" hidden>
  <div class="sheet np-sheet" role="dialog" aria-modal="true" aria-label="Now Playing">
    <div class="np-top"><button id="np-close" class="icon-btn" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="kicker">NOW PLAYING</span><span style="width:28px"></span></div>
    <div id="np-body"></div>
  </div>
</div>

<div id="settings" class="sheet-backdrop" hidden>
  <div class="sheet settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="set-head"><svg class="ic big" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm9 4.8v-2.6l-2.3-.5a7 7 0 0 0-.7-1.6l1.3-2-1.9-1.9-2 1.3a7 7 0 0 0-1.6-.7L13.3 3h-2.6l-.5 2.3a7 7 0 0 0-1.6.7l-2-1.3-1.9 1.9 1.3 2a7 7 0 0 0-.7 1.6L3 10.7v2.6l2.3.5c.2.6.4 1.1.7 1.6l-1.3 2 1.9 1.9 2-1.3c.5.3 1 .5 1.6.7l.5 2.3h2.6l.5-2.3c.6-.2 1.1-.4 1.6-.7l2 1.3 1.9-1.9-1.3-2c.3-.5.5-1 .7-1.6z"/></svg>
      <div><h1 id="settings-title">Settings</h1><p class="sub">Manage Sonix preferences and updates.</p></div><span class="grow"></span><button id="settings-close" class="btn">Done</button></div>
    <fieldset class="group"><legend>App Version</legend>
      <div class="group-row"><div><div id="set-version">Current version: 2.0.0</div><div class="sub small">New Windows and Linux versions are published on shouldbe.media.</div></div>
      <span class="grow"></span><button id="open-site" class="btn prominent">Open Sonix Page</button></div></fieldset>
    <fieldset class="group"><legend>Preferences</legend>
      <label class="toggle"><input type="checkbox" id="set-hq"><span>High Quality Audio</span></label>
      <label class="toggle"><input type="checkbox" id="set-beta"><span>Beta Features</span></label>
    </fieldset>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
