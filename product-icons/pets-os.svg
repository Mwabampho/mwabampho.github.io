<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="petsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="petsEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="petsCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background rounded plate -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#petsBg)" stroke="#10b981" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Inner OS terminal screen -->
  <rect x="10" y="10" width="44" height="44" rx="8" fill="#030712" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.8"/>
  <!-- Top bar dots -->
  <circle cx="16" cy="16" r="2" fill="#ef4444"/>
  <circle cx="22" cy="16" r="2" fill="#f59e0b"/>
  <circle cx="28" cy="16" r="2" fill="#10b981"/>
  <!-- Paw glyph / CPU core in emerald -->
  <ellipse cx="32" cy="38" rx="7" ry="5.5" fill="url(#petsEmerald)"/>
  <circle cx="24" cy="28" r="3" fill="url(#petsEmerald)"/>
  <circle cx="30" cy="24" r="3" fill="url(#petsEmerald)"/>
  <circle cx="36" cy="24" r="3" fill="url(#petsEmerald)"/>
  <circle cx="42" cy="28" r="3" fill="url(#petsEmerald)"/>
  <!-- Prompt chevron -->
  <path d="M14 47L18 49.5L14 52" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="21" y1="52" x2="26" y2="52" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
</svg>
